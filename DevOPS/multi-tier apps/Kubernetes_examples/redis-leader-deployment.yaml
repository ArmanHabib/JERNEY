apiVersion: apps/v1
kind: Deployment

metadata:
  name: redis-leader
  labels:
    app: redis
    role: leader
    tier: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: redis
      role: leader
      tier: backend

  template:
    metadata:
      labels:
        app: redis
        role: leader
        tier: backend

    spec:
      containers:
      - name: redis-leader
        image: docker.io/redis:6.0.5

        resources:
          requests:
            cpu: "100m"
            memory: "100Mi"

        ports:
        - containerPort: 6379

kind: Service

metadata:
  name: redis-leader
  labels:
    app: redis
    role: leader
    tier: backend

spec:
  selector:
    app: redis
    role: leader
    tier: backend

  ports:
  - port: 6379
    targetPort: 6379
apiVersion: v1
kind: Service

metadata:
  name: redis-leader
  labels:
    app: redis
    role: leader
    tier: backend

spec:
  selector:
    app: redis
    role: leader
    tier: backend

  ports:
  - port: 6379
    targetPort: 6379
